# Kodi alone, using the host's services: dbus + avahi-daemon (AirPlay/Zeroconf), ALSA and/or a system-wide PulseAudio
# (socket in /run/pulse), and the kernel's default IR keymap.

name: kodi-rockchip

services:

  kodi:
    container_name: kodi-rockchip-kodi
    image: ${KODI_IMAGE:-ghcr.io/armsurvivors/kodi-rockchip-deb:trixie-rkmpp-latest}
    restart: unless-stopped
    network_mode: host
    privileged: true
    environment:
      TZ: ${TZ:-Etc/UTC}
    entrypoint: ["kodi"]
    command: ["--logging=console", "--audio-backend=${KODI_AUDIO_BACKEND:-alsa+pulseaudio}"]
    volumes:
      - /dev:/dev
      # libinput's udev backend needs the udev database, or Kodi sees no input devices.
      - /run/udev:/run/udev:ro
      # Host system bus (directory, not socket, so it survives a dbus restart); reaches the host avahi-daemon.
      - /run/dbus:/run/dbus
      # Host system-wide PulseAudio socket, if any; harmless without one.
      - /run/pulse:/run/pulse
      - ${KODI_DATA_DIR:-/root/.kodi}:/root/.kodi
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }
